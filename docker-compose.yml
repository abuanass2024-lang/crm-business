services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_business
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_password}
    ports: ["5432:5432"]
    volumes: ["crm_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_business"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:-crm_password}@postgres:5432/crm_business?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting the API}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  crm_pgdata:
