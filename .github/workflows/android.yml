name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build CRM v3 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Create Android platform
        working-directory: mobile_v3
        run: |
          flutter create --platforms=android --org com.crm.business --project-name crm_v3 .

      - name: Get Flutter dependencies
        working-directory: mobile_v3
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile_v3
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK
        working-directory: mobile_v3
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crm-v3-apk
          path: mobile_v3/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
