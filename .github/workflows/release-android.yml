name: Android Release Build
on:
  workflow_dispatch:
    inputs:
      sign_release:
        description: 'Use repository secrets to sign the release'
        required: true
        default: false
        type: boolean
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Prepare signing key
        if: ${{ inputs.sign_release }}
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > mobile/upload-keystore.jks
      - name: Build release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ inputs.sign_release && 'upload-keystore.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=http://10.214.153.114:3000/api
          flutter build appbundle --release --dart-define=API_BASE_URL=http://10.214.153.114:3000/api
      - uses: actions/upload-artifact@v4
        with:
          name: crm-business-v1.6-release
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
