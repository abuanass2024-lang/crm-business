name: Build CRM Business APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Fix AGP and Kotlin versions
        run: |
          cd mobile_v2/android
          sed -i 's/version "9.1.0"/version "8.11.1"/' settings.gradle.kts || true
          sed -i 's/version "2.4.0"/version "2.2.20"/' settings.gradle.kts || true
          sed -i 's/version "8.7.3"/version "8.11.1"/' settings.gradle.kts || true
          cat settings.gradle.kts

      - name: Get Flutter dependencies
        run: |
          cd mobile_v2
          flutter pub get

      - name: Build Release APK (split per ABI)
        run: |
          cd mobile_v2
          flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Verify APK exists
        run: |
          cd mobile_v2
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: crm-business-arm64-apk
          path: mobile_v2/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
